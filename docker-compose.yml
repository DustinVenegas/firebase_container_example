services:
  api:
    build: .
    ports:
      - '13000:3000' # host 13000 -> container 3000 (moved from 3000 to avoid local conflicts)
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GOOGLE_CLOUD_PROJECT=emu-project
      - NODE_ENV=development
      # FIREBASE_TOKEN should be provided via a .env file or environment when needed
    depends_on:
      firestore-emulator:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - example_net

  firestore-emulator:
    build:
      context: ./containers/firebase
      dockerfile: Dockerfile
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
      - FIREBASE_PROJECT_ID=emu-project
    ports:
      - '11080:8080' # Firestore port (host 11080 -> container 8080)
      - '9000:9000' # Emulator UI port
      - '9199:9199' # Auth emulator port
    volumes:
      - ./emulator_data:/data
    command: ["--non-interactive", "emulators:start", "--only", "firestore", "--project", "emu-project", "--import", "/data", "--export-on-exit", "/data"]
    networks:
      - example_net
networks:
  example_net:
    driver: bridge
