services:
  api:
    build: .
    expose:
      - '3000' # api HTTP server
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GOOGLE_CLOUD_PROJECT=emu-project
      - NODE_ENV=development
      # FIREBASE_TOKEN should be provided via a .env file or environment when needed
    depends_on:
      firestore-emulator:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - example_net

  firestore-emulator:
    build:
      context: ./containers/firebase
      dockerfile: Dockerfile
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
      - FIREBASE_PROJECT_ID=emu-project
    expose:
      - '8080' # Firestore port
      - '4400' # Emulator UI port
      - '9150' # Auth emulator port
    volumes:
      - ./emulator_data:/data
    command: ["--non-interactive", "emulators:start", "--only", "firestore", "--project", "emu-project", "--import", "/data", "--export-on-exit", "/data"]
    networks:
      - example_net

networks:
  example_net:
    driver: bridge
    # internal: true

